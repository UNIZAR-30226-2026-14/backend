$kind: http-request
url: "{{baseUrl}}/api/partidas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idPartida": {{partidaId}},
      "turno": 0,
      "fecha": "{{fechaDemo}}",
      "mercado": "obj1,obj2",
      "bolsa": "f1,f2,f3",
      "corriendo": false
    }
order: 1000
