$kind: http-request
name: GET partida actual (guardar bolsa/mercado)
url: "{{baseUrl}}/api/partidas/{{partidaId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const b=pm.response.json();
      pm.collectionVariables.set('bolsaActual', b.bolsa || '');
      pm.collectionVariables.set('mercadoActual', b.mercado || '');
    language: text/javascript
order: 1000
