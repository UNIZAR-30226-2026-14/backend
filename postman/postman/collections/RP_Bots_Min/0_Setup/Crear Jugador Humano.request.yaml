$kind: http-request
url: "{{baseUrl}}/api/jugadores"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "humano_{{runId}}",
      "contrasena": "{{human1Pass}}"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('Jugador creado', function () {
      pm.expect(pm.response.code).to.be.oneOf([200, 201]); });

      const body = pm.response.json();

      pm.collectionVariables.set('human1Id', body.id);

      pm.collectionVariables.set('human1Name', body.nombre);
    language: text/javascript
order: 2000
