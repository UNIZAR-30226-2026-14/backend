$kind: http-request
url: "{{baseUrl}}/api/jugadores"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () { pm.response.to.have.status(200); });
      pm.test('Hay al menos 4 jugadores', function () {
        var data = pm.response.json();
        pm.expect(data.length).to.be.at.least(4);
      });
    language: text/javascript
order: 5000
