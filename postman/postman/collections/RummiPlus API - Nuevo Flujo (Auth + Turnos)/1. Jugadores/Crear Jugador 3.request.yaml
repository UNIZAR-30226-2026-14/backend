$kind: http-request
url: "{{baseUrl}}/api/jugadores"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "{{jugador3Nombre}}",
      "contrasena": "{{passwordComun}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200/201', function () { pm.expect([200, 201]).to.include(pm.response.code); });
      var data = pm.response.json();
      pm.collectionVariables.set('jugador3Id', String(data.id));
      pm.test('ID jugador 3 recibido', function () { pm.expect(data.id).to.be.a('number'); });
    language: text/javascript
order: 3000
