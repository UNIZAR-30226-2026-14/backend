$kind: http-request
url: "{{baseUrl}}/api/amigos/{{jugador1Id}}/{{jugador2Id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () { pm.response.to.have.status(200); });
      var data = pm.response.json();
      pm.test('Sigue en ACEPTADO', function () { pm.expect(data.estado).to.eql('ACEPTADO'); });
    language: text/javascript
order: 5000
