$kind: http-request
url: "{{baseUrl}}/api/amigos?jugadorId={{jugador1Id}}"
method: GET
queryParams:
  jugadorId: "{{jugador1Id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () { pm.response.to.have.status(200); });
      var data = pm.response.json();
      pm.test('Devuelve al menos una amistad', function () {
        pm.expect(data.length).to.be.at.least(1);
      });
    language: text/javascript
order: 3000
