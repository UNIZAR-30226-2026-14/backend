$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "{{jugador4Nombre}}",
      "contrasena": "{{passwordComun}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var data = pm.response.json();
      pm.collectionVariables.set('tokenJugador4', data.token);
    language: text/javascript
order: 4000
