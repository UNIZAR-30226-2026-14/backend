$kind: http-request
url: "{{baseUrl}}/api/auth/logout"
method: POST
headers:
  Authorization: Bearer {{tokenJugador1}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 204 o 200', function () {
        pm.expect([200, 204]).to.include(pm.response.code);
      });
    language: text/javascript
order: 1000
