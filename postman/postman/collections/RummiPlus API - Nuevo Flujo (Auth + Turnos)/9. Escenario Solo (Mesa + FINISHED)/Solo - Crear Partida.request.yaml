$kind: http-request
url: "{{baseUrl}}/api/partidas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "turno": 0,
      "fecha": "2026-04-05",
      "bolsa": "",
      "conjuntoMesa": "",
      "mercado": "",
      "corriendo": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200/201', function () { pm.expect([200, 201]).to.include(pm.response.code); });
      var data = pm.response.json();
      pm.collectionVariables.set('partidaSoloId', String(data.idPartida));
      pm.test('ID partida solo recibido', function () { pm.expect(data.idPartida).to.be.a('number'); });
    language: text/javascript
order: 4000
