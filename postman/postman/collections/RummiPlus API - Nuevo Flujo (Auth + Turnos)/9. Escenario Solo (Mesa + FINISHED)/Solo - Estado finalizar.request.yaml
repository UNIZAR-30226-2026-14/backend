$kind: http-request
url: "{{baseUrl}}/api/partidas/{{partidaSoloId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test('Estado valido', function () {
        pm.expect(['WAITING','RUNNING','FINISHED']).to.include(data.estado);
      });
      if (data.estado === 'FINISHED'){
        pm.test('FINISHED trae ganador/puntuacion', function () {
          pm.expect(data.ganadorId).to.eql(Number(pm.collectionVariables.get('jugadorSoloId')));
          pm.expect(data.puntuacionFinal).to.be.a('string').and.not.empty;
        });
      } else {
        pm.test('Si no termina aun, sigue RUNNING', function () {
          pm.expect(data.estado).to.eql('RUNNING');
        });
      }
    language: text/javascript
order: 11000
