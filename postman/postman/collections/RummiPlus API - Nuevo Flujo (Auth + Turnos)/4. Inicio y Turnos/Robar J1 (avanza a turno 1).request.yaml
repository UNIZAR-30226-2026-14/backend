$kind: http-request
url: "{{baseUrl}}/api/partidas/{{partidaId}}/robar"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenJugador1}}
body:
  type: text
  content: |-
    {
      "idJugador": {{jugador1Id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Turno pasa a 1', function () {
        var data = pm.response.json();
        pm.expect(data.turno).to.eql(1);
      });
    language: text/javascript
order: 3000
