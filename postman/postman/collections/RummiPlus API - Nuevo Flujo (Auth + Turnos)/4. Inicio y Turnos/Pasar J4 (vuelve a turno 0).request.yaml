$kind: http-request
url: "{{baseUrl}}/api/partidas/{{partidaId}}/pasar"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenJugador4}}
body:
  type: text
  content: |-
    {
      "idJugador": {{jugador4Id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Turno vuelve a 0', function () {
        var data = pm.response.json();
        pm.expect(data.turno).to.eql(0);
      });
    language: text/javascript
order: 6000
