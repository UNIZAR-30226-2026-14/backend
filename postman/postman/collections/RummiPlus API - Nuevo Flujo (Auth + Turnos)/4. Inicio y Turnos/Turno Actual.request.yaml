$kind: http-request
url: "{{baseUrl}}/api/partidas/{{partidaId}}/turno-actual"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Turno inicial 0', function () {
        var data = pm.response.json();
        pm.expect(data.turno).to.eql(0);
      });
    language: text/javascript
order: 2000
