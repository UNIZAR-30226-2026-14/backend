$kind: http-request
url: "{{baseUrl}}/api/partidas/{{partidaId}}/siguiente-turno"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenJugador3}}
body:
  type: text
  content: |-
    {
      "idJugador": {{jugador3Id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Turno pasa a 3', function () {
        var data = pm.response.json();
        pm.expect(data.turno).to.eql(3);
      });
    language: text/javascript
order: 7000
