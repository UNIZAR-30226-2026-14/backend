$kind: http-request
url: "{{baseUrl}}/api/partidas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idPartida": {{partidaId}},
      "turno": 0,
      "fecha": "2026-03-31",
      "mercado": "obj1,obj2",
      "bolsa": "f1,f2,f3",
      "conjuntoMesa": "[B01,B02,B03]|[R05,R06,R07]",
      "corriendo": false
    }
order: 1000
