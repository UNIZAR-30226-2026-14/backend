$kind: http-request
url: "{{baseUrl}}/api/partidas/{{partidaId}}/iniciar"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Partida iniciada con turno inicial", function () {
        const body = pm.response.json();
        pm.expect(body.corriendo).to.eql(true);
        pm.expect(body.turno).to.eql(0);
        pm.expect(body.bolsa).to.be.a("string");
        pm.expect(body.bolsa.length).to.be.greaterThan(0);
        pm.expect(body).to.have.property("turnoInicio");
      });
    language: text/javascript
order: 1000
