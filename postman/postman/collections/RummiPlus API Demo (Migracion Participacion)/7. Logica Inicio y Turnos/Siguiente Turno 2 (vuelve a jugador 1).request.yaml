$kind: http-request
url: "{{baseUrl}}/api/partidas/{{partidaId}}/siguiente-turno"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Con 2 jugadores el turno vuelve al slot 0", function () {
        const body = pm.response.json();
        pm.expect(body.corriendo).to.eql(true);
        pm.expect(body.turno).to.eql(0);
      });
    language: text/javascript
order: 5000
