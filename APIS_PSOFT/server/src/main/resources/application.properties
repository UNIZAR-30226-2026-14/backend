spring.application.name=server

# ===== PUERTO Y HTTPS =====
server.port=${PORT:8080}
server.ssl.enabled=true
server.ssl.key-store=classpath:ssl/rummiplus-local.p12
server.ssl.key-store-password=rummiplus123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=rummiplus-local

# ===== POSTGRESQL =====
# DATABASE_URL puede ser JDBC o URI postgres:// / postgresql:// (se normaliza al arrancar).
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:admin123}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== ARCHIVOS ESTÁTICOS (Frontend React/Vite) =====
spring.web.resources.static-locations=file:../../public/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

# ===== BLOQUE INTEGRACION IA BOT (servicio Python) =====
bot.ia.base-url=http://127.0.0.1:8765
bot.ia.move-path=/api/bot/move
bot.ia.health-path=/api/health
bot.ia.timeout-ms=5000
