spring.application.name=server

# ===== HTTPS LOCAL DIRECTO EN SPRING BOOT =====
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:ssl/rummiplus-local.p12
server.ssl.key-store-password=rummiplus123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=rummiplus-local

# ===== BLOQUE POSTGRESQL (docker local) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/rummiplus
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin123

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== BLOQUE INTEGRACION IA BOT (servicio Python) =====
bot.ia.base-url=http://127.0.0.1:8765
bot.ia.move-path=/api/bot/move
bot.ia.health-path=/api/health
bot.ia.timeout-ms=5000
