spring.application.name=server

# ===== BLOQUE H2: estas lineas activan y conectan la base de datos local =====
# URL JDBC de H2 en modo archivo: crea/usa la BD en ./data/rummiplusdb
spring.datasource.url=jdbc:h2:file:./data/rummiplusdb
# Driver JDBC de H2 (necesario para iniciar la conexion)
spring.datasource.driverClassName=org.h2.Driver
# Credenciales locales por defecto para entorno de desarrollo
spring.datasource.username=sa
spring.datasource.password=

# Hibernate recrea tablas en cada arranque para pruebas locales (evita esquemas antiguos)
spring.jpa.hibernate.ddl-auto=create
# Logs SQL para verificar que la BD responde y ejecuta consultas
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 para inspeccionar datos en navegador
spring.h2.console.enabled=true
# Ruta de acceso de la consola: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# ===== BLOQUE INTEGRACION IA BOT (servicio Python) =====
# URL base del servicio de IA (proyecto IA_RummiPlus)
bot.ia.base-url=http://127.0.0.1:8765
# Endpoint para pedir una jugada
bot.ia.move-path=/api/bot/move
# Endpoint de salud de la IA
bot.ia.health-path=/api/health
# Timeout maximo (ms) para llamadas HTTP al servicio IA
bot.ia.timeout-ms=5000
