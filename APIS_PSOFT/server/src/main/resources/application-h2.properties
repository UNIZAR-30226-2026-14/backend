spring.application.name=server

# Perfil H2 local (solo para pruebas rapidas)
spring.datasource.url=jdbc:h2:file:./data/rummiplusdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

bot.ia.base-url=${BOT_IA_BASE_URL:http://127.0.0.1:8765}
bot.ia.move-path=/api/bot/move
bot.ia.health-path=/api/health
bot.ia.timeout-ms=${BOT_IA_TIMEOUT_MS:2000}
