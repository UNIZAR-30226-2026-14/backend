spring.application.name=server

# Perfil PostgreSQL (Docker local)
spring.datasource.url=jdbc:postgresql://localhost:5432/rummiplus
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin123

# En desarrollo con esquema ya creado por SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IA Bot
bot.ia.base-url=http://127.0.0.1:8765
bot.ia.move-path=/api/bot/move
bot.ia.health-path=/api/health
bot.ia.timeout-ms=5000
