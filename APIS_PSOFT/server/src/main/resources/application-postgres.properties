spring.application.name=server

# Perfil PostgreSQL — misma fuente de URL que application.properties
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:admin123}

# En desarrollo con esquema ya creado por SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IA Bot
bot.ia.base-url=${BOT_IA_BASE_URL:http://127.0.0.1:8765}
bot.ia.move-path=/api/bot/move
bot.ia.health-path=/api/health
bot.ia.timeout-ms=${BOT_IA_TIMEOUT_MS:2000}
